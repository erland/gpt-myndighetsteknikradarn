schema_version: 1
project:
  id: myndighetsteknikradarn
  name: Myndighetsteknikradarn
  description: GPT för evidensbaserad kartläggning av vilka svenska myndigheter som
    sannolikt använder en viss teknologi eller produkt samt för efterföljande identifiering
    av relevanta professionella kontaktpersoner.
  version: 1.0.2
  language: sv
profile:
  selected: workflow_research_heavy
  features:
    research_heavy: true
    evidence_required: true
    multi_stage_workflow: true
    structured_knowledge: true
    repeatable_outputs: true
    scripts_required: true
    rich_structured_runtime: true
instructions:
  canonical: src/instructions/canonical.md
architecture:
  target_model: src/models/target-model.yaml
  design: docs/target-architecture.md
  research_workflow: src/workflows/research-flow.yaml
  technology_target_model: src/models/technology-target.yaml
  agency_model: src/models/agency.yaml
  agency_universe_model: src/models/agency-universe.yaml
  source_type_model: src/models/source-type.yaml
  search_plans: src/workflows/search-plans.yaml
  evidence_model: src/models/evidence.yaml
  agency_assessment_model: src/models/agency-assessment.yaml
  result_presentation_model: src/models/result-presentation.yaml
  result_template: src/templates/research-result.md
  contact_candidate_model: src/models/contact-candidate.yaml
  contact_research_run_model: src/models/contact-research-run.yaml
  contact_research_workflow: src/workflows/contact-research-flow.yaml
  contact_result_template: src/templates/contact-result.md
  export_bundle_model: src/models/export-bundle.yaml
  export_policy: src/policies/export-formats.md
  export_script: scripts/export_report.py
  research_run_model: src/models/research-run.yaml
  research_checkpoint_model: src/models/research-checkpoint.yaml
  resume_workflow: src/workflows/resume-flow.yaml
  eval_documentation: docs/evals-and-realistic-test-cases.md
knowledge_architecture:
  canonical_root: knowledge
  source_landscape: knowledge/source-landscape.yaml
runtime:
  primary: chat_zip
  chat_zip:
    enabled: true
    start_here_template: src/templates/START-HERE.chat.md.tpl
    builder: scripts/build_chat_runtime.py
    entrypoint: START-HERE.md
    include_workflows: true
    exclude_scripts:
    - run_evals.py
    - build_chat_runtime.py
  custom_gpt:
    enabled: true
    instruction:
      mode: compiled
      max_characters: 8000
    knowledge:
      max_files: 20
      strategy: compiled
    builder:
      instructions: build/custom-gpt/builder/instructions.md
      conversation_starters: build/custom-gpt/builder/conversation-starters.md
      capabilities: build/custom-gpt/builder/capabilities.md
      knowledge_package: build/custom-gpt/builder/knowledge-package
    instructions_source: src/instructions/custom-gpt.md
    parity_document: docs/custom-gpt-parity.md
    required_capabilities:
    - web_search
    - code_interpreter_or_data_analysis
    role: secondary
    build_script: scripts/build_custom_gpt_runtime.py
    compatibility:
      report_required: true
      parity_symbols:
        equivalent: equivalent
        reduced: reduced
        missing: missing
    validation:
      block_on_instruction_limit: true
      block_on_knowledge_limit: true
      block_on_misleading_core_functionality: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    builder: scripts/build_opencode_runtime.py
    validator: scripts/validate_opencode_runtime.py
    entrypoint: AGENTS.md
    runtime_root: .opencode/myndighetsteknikradarn
    state_root: .myndighetsteknikradarn-state
    output_root: myndighetsteknikradarn-output
exports:
  markdown: true
  pdf: true
  confluence_markup: true
testing:
  planned: false
  regression_tests: tests
  behavioral_evals: evals/cases
  eval_manifest: evals/eval-manifest.yaml
  automated_eval_runner: scripts/run_evals.py
  manual_eval_rubric: evals/manual/RUBRIC.md
  critical_eval_failure_blocks_release: true
  manifest: tests/test-manifest.yaml
  manifest_schema: schemas/test-manifest.schema.json
  eval_case_schema: evals/schema/eval-case.schema.json
  contract_validator: scripts/validate_gpt_builder_tests.py
  automated_behavioral_evals_block_release: true
  manual_runtime_evals_are_separate: true
release:
  github:
    enabled: true
    ci_workflow: .github/workflows/ci.yml
    release_workflow: .github/workflows/release.yml
    version_source: github_release_tag
    artifacts:
    - project_zip
    - chat_zip
    - custom_gpt_zip
    - opencode_zip
    - checksums
    - delivery_manifest
policies:
  research_workflow: src/policies/research-workflow.md
  technology_normalization: src/policies/technology-normalization.md
  agency_universe: src/policies/agency-universe.md
  coverage_accounting: src/policies/coverage-accounting.md
  source_strategy: src/policies/source-strategy.md
  evidence_and_deduplication: src/policies/evidence-and-deduplication.md
  scoring_and_confidence: src/policies/scoring-and-confidence.md
  result_presentation: src/policies/result-presentation.md
  contact_person_research: src/policies/contact-person-research.md
  export_formats: src/policies/export-formats.md
  multipass_resume: src/policies/multipass-resume.md
structure:
  conversation_starters:
    path: src/conversation-starters
  runtime_policy:
    path: src/policies
  schemas:
    path: src/models
  scripts:
    path: scripts
  templates:
    path: src/templates
  workflows:
    path: src/workflows
release_validation:
  architecture_contract: architecture.yaml
  custom_gpt_system_instruction: src/instructions/system.md
  blank_idea_e2e: evals/e2e/blank-idea-001.yaml
  lint_script: scripts/lint_gpt_project.py
  hygiene_script: scripts/project_hygiene.py
  distribution_validator: scripts/validate_distributions.py
  stable_release_document: docs/stable-release.md

migration:
  target: gpt-builder-1.5.0
  type: existing-project
  preserve_domain_behavior: true
  preserve_existing_chat_custom_builds_until_replaced: true

model_robustness:
  level: stateful
  rationale: Stora kartläggningar använder explicit ResearchRun, atomiska ResearchCheckpoint och deterministic resume utan att redan genomfört arbete tappas eller dubbelräknas.
  operational_core: true
  explicit_workflow: true
  deterministic_gates: true
  authoritative_structured_state: true
  resume_recovery: true
  instruction_adherence_evals: true

analysis:
  runtime:
    strategy: peer_candidates
    candidates:
      - runtime_id: chatgpt_chat
        suitability: ready
        activate_by_default: true
        reason: Befintlig Chat ZIP bär hela researchmetoden och stöder flerpassarbete med filbaserad checkpointing.
      - runtime_id: chatgpt_custom
        suitability: ready
        activate_by_default: true
        reason: Metodpariteten är hög; exekveringsdeterminism för scoring, coverage, checkpointing och PDF är reducerad men kärnfunktionen är användbar.
      - runtime_id: claude_project
        suitability: reduced
        activate_by_default: false
        reason: Researchmetoden kan bäras men full persistent state och lokal deterministic toolchain saknas.
      - runtime_id: opencode
        suitability: ready
        activate_by_default: true
        reason: Lokal workspace, shell och scripts passar persistent ResearchRun/checkpoint, scoring, coverage och export.
      - runtime_id: openai_plugin
        suitability: reduced
        activate_by_default: false
        reason: Skills kan bära metodik men ger inte full workspace/state och lokal deterministic toolchain.

capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  requirements:
    web:
      level: required
      reason: Kärnuppgiften kräver färsk evidensbaserad research och verifiering av originalkällor.
    filesystem:
      read: required
      write: recommended
    shell:
      level: recommended
      reason: Agent-runtimes använder scripts för checkpoint, scoring, evals och export.
    code_execution:
      level: recommended
      reason: Behövs för deterministisk scoring, coverage, checkpointing och robust fil/PDF-export.
    structured_data:
      level: required
      reason: TechnologyTarget, Evidence, AgencyAssessment, ResearchRun och checkpoint är strukturerade modeller.
    persistent_state:
      level: required
      reason: Stora kartläggningar måste kunna pausas och återupptas utan kandidat- eller coverage-förlust.
    external_tools:
      level: optional
    image_generation:
      level: not_required

artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    research_result:
      kind: report
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
    research_state:
      kind: data
      format: yaml_or_json
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Canonical ResearchRun med checkpointbar state.
    research_checkpoint:
      kind: data
      format: yaml_or_json
      requirement: conditional
      condition: När arbetet pausas, batchas, delresultat visas eller export/kontaktresearch ska påbörjas.
      persistence: persistent
      multiplicity: many
    contact_result:
      kind: report
      format: markdown
      requirement: conditional
      condition: När användaren begär kontaktpersonsresearch.
      persistence: persistent
      multiplicity: one
    markdown_export:
      kind: report
      format: markdown
      requirement: optional
      persistence: persistent
      multiplicity: one
    pdf_export:
      kind: document
      format: pdf
      requirement: optional
      persistence: persistent
      multiplicity: one
    confluence_export:
      kind: document
      format: confluence
      requirement: optional
      persistence: persistent
      multiplicity: one
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one

workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: preferred
    portable: true
    separate_from_assistant: true
    description: Researchdata, checkpoint-state och exportresultat ska hållas separerade från runtimefiler.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    model: src/models/research-run.yaml
    checkpoint_model: src/models/research-checkpoint.yaml
    resume_workflow: src/workflows/resume-flow.yaml
    description: ResearchRun är auktoritativ state; checkpoints är validerbara snapshots och next_work får aldrig vara enda sanningen.
  runtime_preferences:
    chat: conversation_or_file
    agent: workspace_file

tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
    - id: eval-runner
      type: script
      requirement: required
      purpose: Köra deterministic behavioral evals och release-blockerande regressioner.
      script: scripts/run_evals.py
      deterministic: true
      mutates_workspace: false
      runtime_fallback: manual
    - id: report-export
      type: script
      requirement: recommended
      purpose: Exportera samma canonical ResultPresentation till stödda format utan ny research.
      script: scripts/export_report.py
      deterministic: true
      mutates_workspace: true
      runtime_fallback: manual

ci:
  enabled: true
  workflow: .github/workflows/ci.yml

runtime_parity:
  model: runtime-parity.yaml
  registered_runtimes:
    - chatgpt_chat
    - chatgpt_custom
    - claude_project
    - opencode
    - openai_plugin
  compared_categories:
    - behavior
    - capability
    - artifact
    - workspace_state
    - tool
