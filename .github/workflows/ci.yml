name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint canonical project
        run: python scripts/lint_gpt_project.py --project-root .

      - name: Validate project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final

      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q

      - name: Run realistic evals
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/run_evals.py --json

      - name: Remove test-generated build artifacts
        shell: bash
        run: rm -rf build dist .pytest_cache tests/__pycache__ scripts/__pycache__

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open('gpt-project.yaml', encoding='utf-8'))['project']['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Chat ZIP
        run: python scripts/build_chat_runtime.py --project-root . --version "${{ steps.version.outputs.version }}"

      - name: Build Custom GPT ZIP
        run: python scripts/build_custom_gpt_runtime.py --project-root . --version "${{ steps.version.outputs.version }}"

      - name: Validate built distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Verify distribution checksums
        shell: bash
        run: |
          cd dist
          sha256sum --check *.zip.sha256

      - name: Upload validation distributions
        uses: actions/upload-artifact@v4
        with:
          name: myndighetsteknikradarn-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
