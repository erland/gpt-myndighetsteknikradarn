      reason: Förkortningen har flera betydelser utanför tydlig OpenShift-kontext.
  ambiguity_notes:
    - OpenShift kan förekomma som familjenamn; kontrollera att källan avser rätt erbjudande.
  search_terms:
    exact:
      - '"Red Hat OpenShift Container Platform"'
      - '"OpenShift Container Platform"'
    expansion:
      - 'OpenShift'
      - 'OCP Kubernetes Red Hat'
    disambiguation:
      - 'Red Hat OpenShift'
      - 'OpenShift Container Platform'
    negative_terms: []
