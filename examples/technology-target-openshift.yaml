      relationship: competitor
      notes: Kubernetes management-plattform men inte OpenShift.
    - term: Red Hat OpenShift Dedicated
      relationship: adjacent_technology
      notes: Separat managed offering; ska inte automatiskt räknas som OCP.
  exclusions:
